version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'bash', '-c', "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD', 'bash', '-c', "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  source-db:
    image: postgres:13
    container_name: source-db
    hostname: source-db
    ports:
      - "${SOURCE_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SOURCE_DB_NAME:-source_db}
    command: >
      postgres -c wal_level=logical
               -c max_wal_senders=4
               -c max_replication_slots=4
    volumes:
      - ./db-init/source:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  target-db:
    image: postgres:13
    container_name: target-db
    hostname: target-db
    ports:
      - "${TARGET_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${TARGET_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TARGET_DB_NAME:-target_db}
    volumes:
      - ./db-init/target:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  connect:
    image: debezium/connect:2.5
    container_name: connect
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: connect
      PLUGIN_PATH: /kafka/connect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot init container: waits for connect to be healthy, then registers
  # the Debezium connector. Exits 0 on success; Docker marks it as exited (not
  # unhealthy), which is expected for a one-shot init service.
  connector-init:
    image: curlimages/curl:8.5.0
    container_name: connector-init
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - ./connectors:/connectors
    environment:
      CONNECT_URL: ${CONNECT_URL:-http://connect:8083}
    entrypoint: ["/bin/sh", "/scripts/register-connector.sh"]
    restart: "no"

  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      kafka:
        condition: service_healthy
      target-db:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-dbserver1.public.products}
      DB_HOST: ${DB_HOST:-target-db}
      DB_NAME: ${DB_NAME:-target_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[c]onsumer.py' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
